<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>OSM to Arma 3 Eden City Generator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style> * { box-sizing: border-box; } html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #111; color: #eee; } #app { width: 100%; height: 100%; display: flex; flex-direction: column; } #toolbar { background: #1b1b1b; border-bottom: 1px solid #444; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 1000; } #searchInput { width: 320px; max-width: 100%; padding: 9px 10px; background: #292929; color: #fff; border: 1px solid #555; border-radius: 4px; outline: none; } #searchInput:focus { border-color: #888; } button { padding: 9px 14px; border: 1px solid #666; border-radius: 4px; background: #333; color: #fff; cursor: pointer; } button:hover { background: #444; } button:disabled { opacity: 0.5; cursor: not-allowed; } #map { flex: 1; min-height: 300px; } #bottomPanel { background: #1b1b1b; border-top: 1px solid #444; padding: 10px 12px; max-height: 260px; overflow-y: auto; } #status { font-size: 14px; line-height: 1.45; white-space: pre-wrap; color: #ddd; margin-bottom: 8px; } #results { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; } .result { background: #292929; border: 1px solid #444; border-radius: 4px; padding: 8px 10px; cursor: pointer; font-size: 13px; } .result:hover { background: #383838; } #info { color: #999; font-size: 12px; line-height: 1.5; } </style>

</head>

<body>

<div id="app">

<div id="toolbar">

    <input
        id="searchInput"
        type="text"
        placeholder="Search for a city or place..."
    >

    <button id="searchButton">
        Search
    </button>

    <button id="drawButton">
        Draw Area
    </button>

    <button id="generateButton" disabled>
        Generate SQF
    </button>

    <button id="clearButton">
        Clear
    </button>

    <label style="color:#ccc;font-size:13px;white-space:nowrap;" title="Multiplies the distances between buildings. 1 = real-world spacing. Building models are not resized.">
        Spacing scale
        <input id="scaleInput" type="number" value="1" min="0.1" max="5" step="0.05" style="width:70px;flex:none;">
    </label>

    <label style="color:#ccc;font-size:13px;white-space:nowrap;" title="Buildings closer together than this are skipped (largest kept first) so models do not stack. 0 = keep everything.">
        Min gap (m)
        <input id="gapInput" type="number" value="12" min="0" max="60" step="1" style="width:60px;flex:none;">
    </label>

</div>

<div id="extras" style="background:#202020;border-bottom:1px solid #444;padding:8px 10px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:#ccc;font-size:13px;"></div>

<div id="map"></div>

<div id="bottomPanel">

    <div id="status">

Search for a city or place, then draw a rectangle around the area you want to import.
</div>

    <div id="results"></div>

    <div id="info">
        OSM data © OpenStreetMap contributors.
    </div>

</div>

</div>

<script> const map = L.map("map").setView( [51.505, -0.09], 13 ); const esriStreet = L.tileLayer( "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Tiles &copy; Esri" } ).addTo(map);

L.control.layers( { "Esri Streets": esriStreet, "Esri Satellite": esriImagery, "OpenStreetMap (needs http:// server)": osmStandard } ).addTo(map); const searchInput = document.getElementById("searchInput"); const searchButton = document.getElementById("searchButton"); const drawButton = document.getElementById("drawButton"); const generateButton = document.getElementById("generateButton"); const clearButton = document.getElementById("clearButton"); const statusBox = document.getElementById("status"); const resultsBox = document.getElementById("results"); let selectedBounds = null; let selectionRectangle = null; let drawMode = false; let drawing = false; let drawStart = null; const HOUSE_CLASSES = [ "Land_House_1W01_F", "Land_House_1W10_F", "Land_House_1W11_F", "Land_House_1W12_F", "Land_House_1W13_F", "Land_House_1W02_F", "Land_House_1W03_F", "Land_House_1W04_F", "Land_House_1W05_F", "Land_House_1W06_F", "Land_House_1W07_F", "Land_House_1W08_F", "Land_House_1W09_F", "Land_House_2W01_F", "Land_House_2W02_F", "Land_House_2W03_F", "Land_House_2W04_F", "Land_House_2W05_F" ]; const DIRT_PATCH_CLASS = "Land_DirtPatch_01_6x8_F"; const OVERPASS_APIS = [ "https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter" ];
const OSM_API_JSON = "https://api.openstreetmap.org/api/0.6/map.json"; const NOMINATIM_API = "https://nominatim.openstreetmap.org/search"; const EARTH_RADIUS = 6378137; const EXTRA_TYPES = [
    { id: "lamp",    label: "Street lamps", tag: ["highway", "street_lamp"],   cls: "Land_LampStreet_F",    on: true  },
    { id: "bench",   label: "Benches",      tag: ["amenity", "bench"],         cls: "Land_Bench_F",         on: true  },
    { id: "bin",     label: "Bins",         tag: ["amenity", "waste_basket"],  cls: "Land_GarbageBin_01_F", on: true  },
    { id: "tree",    label: "Trees",        tag: ["natural", "tree"],          cls: "",                     on: false },
    { id: "hydrant", label: "Hydrants",     tag: ["emergency", "fire_hydrant"], cls: "",                    on: false }
];
function buildExtrasUI() {

        wrap.innerHTML = '<input type="checkbox" id="ex_' + ex.id + '_on"' + (ex.on ? " checked" : "") + '> ' + ex.label +
            ' <input type="text" id="ex_' + ex.id + '_cls" value="' + ex.cls + '" placeholder="paste class from Eden" ' +
            'style="width:190px;padding:5px 7px;background:#292929;color:#fff;border:1px solid #555;border-radius:4px;">';

function getEnabledExtras() {

    } ).map( ex => ({

buildExtrasUI();
const MAX_AREA_KM2 = 10;
function boundsInfo(b) {
    const lat = (b.south + b.north) / 2;
    const h = Math.abs(b.north - b.south) * 111320;
    const w = Math.abs(b.east - b.west) * 111320 * Math.cos( lat * Math.PI / 180 );
    return { widthM: w, heightM: h, areaKm2: (w * h) / 1e6 };
}
function setStatus(message) { statusBox.textContent = message; } function escapeHtml(value) { return String(value) .replaceAll("&", "&amp;") .replaceAll("<", "&lt;") .replaceAll(">", "&gt;") .replaceAll('"', "&quot;") .replaceAll("'", "&#039;"); } async function geocode(query) {
    try {
        const response = await fetch( NOMINATIM_API + "?format=jsonv2&limit=8&q=" + encodeURIComponent(query) );
        if (!response.ok) {
            throw new Error( "Nominatim HTTP " + response.status );
        }
        return await response.json();
    } catch (error) {
        console.warn( "Nominatim failed, trying Photon:", error );
        const response = await fetch( "https://photon.komoot.io/api/?limit=8&q=" + encodeURIComponent(query) );
        if (!response.ok) {
            throw new Error( "Photon HTTP " + response.status );
        }
        const data = await response.json();
        return data.features.map( feature => {
            const p = feature.properties;
            const place = {
                display_name: [ p.name, p.street, p.city, p.state, p.country ].filter(Boolean).join(", "),
                lat: feature.geometry.coordinates[1],
                lon: feature.geometry.coordinates[0]
            };
            if (p.extent) {
                place.boundingbox = [ p.extent[3], p.extent[1], p.extent[0], p.extent[2] ];
            }
            return place;
        } );
    }
}

async function searchPlaces() { const query = searchInput.value.trim(); if (!query) { setStatus("Enter a city or place to search."); return; } searchButton.disabled = true; resultsBox.innerHTML = ""; setStatus("Searching OpenStreetMap..."); try { const url = NOMINATIM_API + "?format=jsonv2" + "&limit=8" + "&addressdetails=1" + "&q=" + encodeURIComponent(query); const results = await geocode(query); if (!results.length) { setStatus("No locations found."); return; } results.forEach(place => { const result = document.createElement("div"); result.className = "result"; result.innerHTML = "<strong>" + escapeHtml( place.display_name ) + "</strong>"; result.addEventListener( "click", () => { const lat = parseFloat(place.lat); const lon = parseFloat(place.lon); map.setView( [lat, lon], 15 ); if (place.boundingbox) { const south = parseFloat( place.boundingbox[0] ); const north = parseFloat( place.boundingbox[1] ); const west = parseFloat( place.boundingbox[2] ); const east = parseFloat( place.boundingbox[3] ); map.fitBounds([ [south, west], [north, east] ]); } setStatus( "Selected:\n" + place.display_name + "\n\n" + "Click Draw Area and drag over the area you want." ); } ); resultsBox.appendChild(result); }); setStatus( results.length + " result(s) found." ); } catch (error) { console.error(error); setStatus( "Search failed:\n" + error.message ); } finally { searchButton.disabled = false; } } searchButton.addEventListener( "click", searchPlaces ); searchInput.addEventListener( "keydown", event => { if (event.key === "Enter") { searchPlaces(); } } ); drawButton.addEventListener( "click", () => { drawMode = !drawMode; if (drawMode) { map.dragging.disable(); drawButton.textContent = "Drawing..."; setStatus( "Drag across the map to select the OSM area." ); } else { map.dragging.enable(); drawButton.textContent = "Draw Area"; setStatus( "Drawing cancelled." ); } } ); map.on( "mousedown", event => { if (!drawMode) { return; } drawing = true; drawStart = event.latlng; if (selectionRectangle) { map.removeLayer( selectionRectangle ); } selectionRectangle = L.rectangle( [ drawStart, drawStart ], { color: "#ff4444", weight: 2, fillOpacity: 0.08 } ).addTo(map); } ); map.on( "mousemove", event => { if (!drawMode || !drawing) { return; } selectionRectangle.setBounds( L.latLngBounds( drawStart, event.latlng ) ); } ); map.on( "mouseup", event => { if (!drawMode || !drawing) { return; } drawing = false; const bounds = L.latLngBounds( drawStart, event.latlng ); selectedBounds = { south: bounds.getSouth(), west: bounds.getWest(), north: bounds.getNorth(), east: bounds.getEast() }; drawMode = false; map.dragging.enable(); drawButton.textContent = "Draw Area"; generateButton.disabled = false; setStatus( "OSM area selected.\n\n" + "South: " + selectedBounds.south.toFixed(6) + "\n" + "West: " + selectedBounds.west.toFixed(6) + "\n" + "North: " + selectedBounds.north.toFixed(6) + "\n" + "East: " + selectedBounds.east.toFixed(6) + "\n\n" + (function(){ const i = boundsInfo(selectedBounds); return "Size: " + Math.round(i.widthM) + " m x " + Math.round(i.heightM) + " m (" + i.areaKm2.toFixed(2) + " km2)\n" + (i.areaKm2 > MAX_AREA_KM2 ? "TOO LARGE - max is " + MAX_AREA_KM2 + " km2. Draw a smaller area.\n\n" : "\n"); })() + "Click Generate SQF." ); } ); clearButton.addEventListener( "click", () => { if (selectionRectangle) { map.removeLayer( selectionRectangle ); selectionRectangle = null; } selectedBounds = null; generateButton.disabled = true; drawMode = false; drawing = false; map.dragging.enable(); drawButton.textContent = "Draw Area"; resultsBox.innerHTML = ""; setStatus( "Selection cleared." ); } ); function getGridForBounds(bounds) { const south = bounds.south; const west = bounds.west; const north = bounds.north; const east = bounds.east; const centerLat = (south + north) / 2; const metersLat = (north - south) * 111320; const metersLon = (east - west) * 111320 * Math.cos( centerLat * Math.PI / 180 ); const maxCellMeters = 350; let cols = Math.ceil( Math.ab     const bbox = [ bounds.south, bounds.west, bounds.north, bounds.east ].join(",");
    const extraParts = getEnabledExtras().map( ex => "node[\"" + ex.tag[0] + "\"=\"" + ex.tag[1] + "\"](" + bbox + ");" );
    const query = "[out:json][timeout:60];(" + "way[\"building\"](" + bbox + ");" + extraParts.join("") + ");out geom qt;";

                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    body: body,
                    signal: controllers[i].signal

async function fetchApiCell(cell) {
    const bbox = [ cell.west, cell.south, cell.east, cell.north ].join(",");
    const url = OSM_API_JSON + "?bbox=" + encodeURIComponent(bbox);
    let lastError = null;
    for ( let attempt = 1; attempt <= 4; attempt++ ) {
        try {
            const response = await fetch( url, { headers: { "Accept": "application/json" } } );
            if ( response.status === 429 || response.status === 509 || response.status >= 500 ) {
                throw new Error( "HTTP " + response.status + " (server busy)" );
            }
            if (!response.ok) {
                throw new Error( "HTTP " + response.status );
            }
            return await response.json();
        } catch (error) {
            lastError = error;
            await new Promise( resolve => setTimeout( resolve, 1500 * attempt ) );
        }
    }
    throw lastError;
}

async function downloadOSMApi(bounds) {
    const cells = getGridForBounds(bounds);
    const elementMap = new Map();
    let next = 0;
    let done = 0;
    const worker = async () => {
        while ( next < cells.length ) {
            const cell = cells[next++];
            const data = await fetchApiCell(cell);
            if ( data && Array.isArray(data.elements) ) {
                for ( const element of data.elements ) {
                    const key = element.type + "/" + element.id;
                    if ( !elementMap.has(key) ) {
                        elementMap.set( key, element );
                    }
                }
            }
            done++;
            setStatus( "Overpass was busy - using the OSM API instead.\n\nDownloading OSM data...\nCell " + done + " of " + cells.length );
        }
    };
    setStatus( "Overpass was busy - using the OSM API instead.\n\nDownloading OSM data...\nCell 0 of " + cells.length );
    await Promise.all( [ worker(), worker(), worker() ] );
    return { elements: Array.from( elementMap.values() ) };
}

async function downloadOSM(bounds) {
    try {
        return await downloadOverpass(bounds);
    } catch (overpassError) {
        console.warn( overpassError );
        try {
            return await downloadOSMApi(bounds);
        } catch (apiError) {
            throw new Error( overpassError.message + "\n\nFallback (OSM API) also failed:\n" + apiError.message );
        }
    }
}

function buildNodeIndex(elements) { const nodes = new Map(); for ( const element of elements ) { if ( element.type === "node" && typeof element.lat === "number" && typeof element.lon === "number" ) { nodes.set( element.id, { lat: element.lat, lon: element.lon } ); } } return nodes; } function getWayCoordinates( way, nodes ) { if ( way.geometry ) { if ( way.geometry.length < 2 || way.geometry.some( p => !p ) ) { return []; } return way.geometry.map( p => ({ lat: p.lat, lon: p.lon }) ); } if ( !way.nodes || way.nodes.length < 2 ) { return []; } const coordinates = []; for ( const nodeId of way.nodes ) { const node = nodes.get(nodeId); if (!node) { return []; } coordinates.push({ lat: node.lat, lon: node.lon }); } return coordinates; } function isClosedWay(coordinates) { if (coordinates.length < 4) { return false; } const first = coordinates[0]; const last = coordinates[ coordinates.length - 1 ]; return ( Math.abs( first.lat - last.lat ) < 0.0000001 && Math.abs( first.lon - last.lon ) < 0.0000001 ); } function geoToLocal( point, originLat, originLon ) { const latitudeRadians = originLat * Math.PI / 180; return { x: ( point.lon - originLon ) * Math.cos( latitudeRadians ) * EARTH_RADIUS * Math.PI / 180, y: ( point.lat - originLat ) * EARTH_RADIUS * Math.PI / 180 }; } function localPolygon( coordinates, originLat, originLon ) { return coordinates.map( point => geoToLocal( point, originLat, originLon ) ); } function polygonAreaMeters( coordinates, latitudeReference ) { if (coordinates.length < 3) { return 0; } let area = 0; const cosLat = Math.cos( latitudeReference * Math.PI / 180 ); for ( let i = 0; i < coordinates.length; i++ ) { const a = coordinates[i]; const b = coordinates[ (i + 1) % coordinates.length ]; const x1 = a.lon * 111320 * cosLat; const y1 = a.lat * 111320; const x2 = b.lon * 111320 * cosLat; const y2 = b.lat * 111320; area += x1 * y2 - x2 * y1; } return Math.abs(area) / 2; } function polygonCentroid( coordinates ) { if (coordinates.length < 3) { return { lat: coordinates[0]?.lat || 0, lon: coordinates[0]?.lon || 0 }; } let sumX = 0; let sumY = 0; let area = 0; const latitudeReference = coordinates.reduce( (sum, point) => sum + point.lat, 0 ) / coordinates.length; const cosLat = Math.cos( latitudeReference * Math.PI / 180 ); const points = coordinates.map( point => ({ x: point.lon * 111320 * cosLat, y: point.lat * 111320 }) ); for ( let i = 0; i < points.length; i++ ) { const a = points[i]; const b = points[ (i + 1) % points.length ]; const cross = a.x * b.y - b.x * a.y; area += cross; sumX += (a.x + b.x) * cross; sumY += (a.y + b.y) * cross; } if ( Math.abs(area) < 0.000001 ) { return { lat: coordinates.reduce( (sum, point) => sum + point.lat, 0 ) / coordinates.length, lon: coordinates.reduce( (sum, point) => sum + point.lon, 0 ) / coordinates.length }; } return { lat: ( sumY / (3 * area) ) / 111320, lon: ( sumX / (3 * area) ) / ( 111320 * cosLat ) }; } function getConvexHull(points) { if (points.length <= 3) { return points.slice(); } const sorted = points .map(point => ({ x: point.x, y: point.y })) .sort( (a, b) => { if (a.x !== b.x) { return a.x - b.x; } return a.y - b.y; } ); function cross(o, a, b) { return ( (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x) ); } const lower = []; for ( const point of sorted ) { while ( lower.length >= 2 && cross( lower[ lower.length - 2 ], lower[ lower.length - 1 ], point ) <= 0 ) { lower.pop(); } lower.push(point); } const upper = []; for ( let i = sorted.length - 1; i >= 0; i-- ) { const point = sorted[i]; while ( upper.length >= 2 && cross( upper[ upper.length - 2 ], upper[ upper.length - 1 ], point ) <= 0 ) { upper.pop(); } upper.push(point); } lower.pop(); upper.pop(); return lower.concat(upper); } function normalizeAngle(angle) { let result = angle % 180; if (result < 0) { result += 180; } return result; } function orientedBoundingBox(points) { if (points.length < 2) { return { angle: 0, width: 0, length: 0 }; } const hull = getConvexHull(points); let bestArea = Infinity; let bestAngle = 0; let bestWidth = 0; let bestLength = 0; for ( let i = 0; i < hull.length; i++ ) { const a = hull[i]; const b = hull[ (i + 1) % hull.length ]; const dx = b.x - a.x; const dy = b.y - a.y; const edgeLength = Math.sqrt( dx * dx + dy * dy ); if (edgeLength < 0.001) { continue; } const ux = dx / edgeLength; const uy = dy / edgeLength; const vx = -uy; const vy = ux; let minU = Infinity; let maxU = -Infinity; let minV = Infinity; let maxV = -Infinity; for ( const point of hull ) { const u = point.x * ux + point.y * uy; const v = point.x * vx + point.y * vy; minU = Math.min( minU, u ); maxU = Math.max( maxU, u ); minV = Math.min( minV, v ); maxV = Math.max( maxV, v ); } const width = maxU - minU; const length = maxV - minV; const area = width * length; if (area < bestArea) { bestArea = area; if (width >= length) { bestAngle = Math.atan2( ux, uy ) * 180 / Math.PI; bestWidth = width; bestLength = length; } else { bestAngle = Math.atan2( vx, vy ) * 180 / Math.PI; bestWidth = length; bestLength = width; } } } return { angle: normalizeAngle( bestAngle ), width: bestWidth, length: bestLength }; } function chooseHouseClass( area, wayId ) { const smallHouses = [ "Land_House_1W01_F", "Land_House_1W10_F", "Land_House_1W11_F", "Land_House_1W12_F", "Land_House_1W13_F", "Land_House_1W02_F", "Land_House_1W03_F", "Land_House_1W04_F", "Land_House_1W05_F", "Land_House_1W06_F", "Land_House_1W07_F", "Land_House_1W08_F", "Land_House_1W09_F" ]; const largeHouses = [ "Land_House_2W01_F", "Land_House_2W02_F", "Land_House_2W03_F", "Land_House_2W04_F", "Land_House_2W05_F" ]; const pool = area >= 180 ? largeHouses : smallHouses; const index = Math.abs(wayId) % pool.length; return pool[index]; } function shouldPlaceDirtPatch( wayId, area ) { if (area < 80) { return false; } return ( Math.abs(wayId) % 5 ) === 0; } function number(value) { if (!Number.isFinite(value)) { return "0"; } return value.toFixed(2); } function filterByGap( buildings, originLat, originLon ) {
    const gap = parseFloat( document.getElementById("gapInput").value ) || 0;
    const scale = parseFloat( document.getElementById("scaleInput").value ) || 1;

        return { kept: buildings, skipped: 0 };
    }
    const sorted = buildings.slice().sort( (a, b) => b.area - a.area );
    const cell = gap;
    const grid = new Map();
    const kept = [];
    for ( const building of sorted ) {
        const p = geoToLocal( building.center, originLat, originLon );
        const x = p.x * scale;
        const y = p.y * scale;
        const cx = Math.floor( x / cell );
        const cy = Math.floor( y / cell );
        let blocked = false;
        for ( let dx = -1; dx <= 1 && !blocked; dx++ ) {
            for ( let dy = -1; dy <= 1 && !blocked; dy++ ) {
                const bucket = grid.get( (cx + dx) + "," + (cy + dy) );
                if (!bucket) {
                    continue;

                for ( const q of bucket ) {
                    if ( Math.hypot( q.x - x, q.y - y ) < gap ) {
                        blocked = true;
                        break;
                    }
                }

        }
        if (blocked) {
            continue;
        }
        const key = cx + "," + cy;
        if ( !grid.has(key) ) {
            grid.set( key, [] );
        }
        grid.get(key).push( { x: x, y: y } );
        kept.push(building);
    }
    return { kept: kept, skipped: buildings.length - kept.length };
}

function generateSQF( buildings, originLat, originLon ) {
    const scale = parseFloat( document.getElementById("scaleInput").value ) || 1;
    const compact = value => String( Number( value.toFixed(1) ) );
    const classList = [];
    const classIndex = new Map();
    const indexOfClass = className => {
        if ( !classIndex.has(className) ) {
            classIndex.set( className, classList.length );
            classList.push(className);
        }
        return classIndex.get(className);
    };
    const rows = [];
    const allCenters = buildings.map( b => { const p = geoToLocal( b.center, originLat, originLon ); return { x: p.x * scale, y: p.y * scale }; } );
    for ( let bi = 0; bi < buildings.length; bi++ ) {
        const building = buildings[bi];
        const raw = geoToLocal( building.center, originLat, originLon );
        const center = { x: raw.x * scale, y: raw.y * scale };
        rows.push( "[" + indexOfClass(building.className) + "," + compact(center.x) + "," + compact(center.y) + "," + compact(building.direction) + "]" );
        if (building.placeDirtPatch) {
            const patchOffset = 7;
            const patchAngle = ( building.direction + 90 ) * Math.PI / 180;
            const patchX = center.x + Math.sin(patchAngle) * patchOffset;
            const patchY = center.y + Math.cos(patchAngle) * patchOffset;
            const crowded = allCenters.some( (c, ci) => ci !== bi && Math.hypot( c.x - patchX, c.y - patchY ) < 8 );
            if (crowded) {
                continue;
            }
            rows.push( "[" + indexOfClass(DIRT_PATCH_CLASS) + "," + compact(patchX) + "," + compact(patchY) + "," + compact(building.direction) + "]" );
        }
    }
    const lines = [];
    lines.push( "// Spacing scale used: " + scale );
    lines.push( "// Format of each row: [classIndex, eastMetres, northMetres, headingDegrees]" );
    lines.push( "private _anchor = screenToWorld [0.5,0.5];" );
    lines.push( "private _camDir = screenToWorldDirection [0.5,0.5];" );
    lines.push( "private _h = (_camDir select 0) atan2 (_camDir select 1);" );
    lines.push( "private _ax = _anchor select 0;" );
    lines.push( "private _ay = _anchor select 1;" );
    lines.push( "private _classes = [" + classList.map( c => '"' + c + '"' ).join(",") + "];" );
    lines.push( "private _data = [" );
    lines.push( rows.join(",\n") );
    lines.push( "];" );
    lines.push( "private _objects = [];" );
    lines.push( "private _missing = [];" );
    lines.push( "collect3DENHistory {" );
    lines.push( "  {" );
    lines.push( "    _x params [\"_ci\",\"_lx\",\"_ly\",\"_rot\"];" );
    lines.push( "    private _cls = _classes select _ci;" );
    lines.push( "    if (isClass (configFile >> \"CfgVehicles\" >> _cls)) then {" );
    lines.push( "      private _pos = [_ax + _lx * cos _h + _ly * sin _h, _ay + _ly * cos _h - _lx * sin _h, 0];" );
    lines.push( "      private _e = create3DENEntity [\"Object\", _cls, _pos, true];" );
    lines.push( "      _e set3DENAttribute [\"rotation\", [0, 0, _rot + _h]];" );
    lines.push( "      _objects pushBack _e;" );
    lines.push( "    } else {" );
    lines.push( "      _missing pushBackUnique _cls;" );
    lines.push( "    };" );
    lines.push( "  } forEach _data;" );
    lines.push( "};" );
    lines.push( "set3DENSelected _objects;" );
    lines.push( "[count _objects, _missing]" );
    return lines.join("\n");
}

async function generateCity() { if (!selectedBounds) { setStatus( "Draw an area first." ); return; } const sizeInfo = boundsInfo(selectedBounds); if ( sizeInfo.areaKm2 > MAX_AREA_KM2 ) { setStatus( "Area is too large (" + sizeInfo.areaKm2.toFixed(2) + " km2, max " + MAX_AREA_KM2 + " km2).\n\nClick Clear and draw a smaller rectangle - a neighbourhood or a few blocks." ); return; } generateButton.disabled = true; try { const data = await downloadOSM( selectedBounds ); setStatus( "Processing OSM building footprints..." ); const nodes = buildNodeIndex( data.elements ); const ways = data.elements.filter( element => element.type === "way" ); const originLat = ( selectedBounds.south + selectedBounds.north ) / 2; const originLon = ( selectedBounds.west + selectedBounds.east ) / 2; const buildings = []; for ( const way of ways ) { if ( !way.tags || !way.tags.building ) { continue; } const coordinates = getWayCoordinates( way, nodes ); if (coordinates.length < 4) { continue; } if (!isClosedWay(coordinates)) { continue; } const center = polygonCentroid( coordinates ); const area = polygonAreaMeters( coordinates, center.lat ); if (area < 15) { continue; } const localPoints = localPolygon( coordinates, originLat, originLon ); const orientedBox = orientedBoundingBox( localPoints ); const className = chooseHouseClass( area, way.id ); const placeDirtPatch = shouldPlaceDirtPatch( way.id, area ); buildings.push({ id: way.id, center: center, area: area, direction: orientedBox.angle, className: className, placeDirtPatch: placeDirtPatch }); } const extras = getEnabledExtras(); const props = []; const propCounts = {}; for ( const el of data.elements ) { if ( el.type !== "node" || !el.tags || typeof el.lat !== "number" ) { continue; } if ( el.lat < selectedBounds.south || el.lat > selectedBounds.north || el.lon < selectedBounds.west || el.lon > selectedBounds.east ) { continue; } for ( const ex of extras ) { if ( el.tags[ex.tag[0]] === ex.tag[1] ) { const d = parseFloat(el.tags.direction); props.push({ center: { lat: el.lat, lon: el.lon }, direction: Number.isFinite(d) ? d : 0, className: ex.cls, placeDirtPatch: false }); propCounts[ex.label] = (propCounts[ex.label] || 0) + 1; break; } } } if (!buildings.length && !props.length) { setStatus( "No usable OSM buildings or selected extra objects were found." ); return; } const filtered = filterByGap( buildings, originLat, originLon ); const skippedForGap = filtered.skipped; buildings.splice( 0, buildings.length, ...filtered.kept ); const sqf = generateSQF( buildings.concat(props), originLat, originLon ); const blob = new Blob( [sqf], { type: "text/plain;charset=utf-8" } ); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = "generated_city.sqf"; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); const dirtCount = buildings.filter( building => building.placeDirtPatch ).length; setStatus( "Generation complete.\n\n" + "OSM elements: " + data.elements.length + "\n" + "Eden buildings: " + buildings.length + " (skipped " + skippedForGap + " that were too close)\n" + "Dirt patches: " + dirtCount + "\n" + "Extra objects: " + ( props.length ? Object.keys(propCounts).map( k => k + " " + propCounts[k] ).join(", ") : "none" ) + "\n\n" + "generated_city.sqf downloaded.\n\n" + "In Eden, put the camera where you want the CENTER of the OSM area, look in the direction you want the city facing, and run the SQF in the Debug Console." ); } catch (error) { console.error(error); setStatus( "Generation failed:\n" + error.message ); } finally { generateButton.disabled = false; } } generateButton.addEventListener( "click", generateCity ); </script>
